<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Kozel</title>
<meta name="theme-color" content="#083436">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kozel">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-512.png">
<link rel="manifest" href="manifest.json">
<style>
  :root {
    --felt: #0d4a4c;
    --felt-dark: #083436;
    --sky: #3cc3dd;
    --gold: #f2c230;
    --card: #fbfaf5;
    --ink: #1c1c1c;
    --red: #c8102e;
    --muted: #9fc9c9;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(ellipse at 50% 40%, var(--felt) 0%, var(--felt-dark) 85%);
    color: #eaf6f6;
    font-family: -apple-system, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    font-size: 15px;
  }
  #app { max-width: 480px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; padding: 10px 10px 16px; gap: 8px; }

  /* Header */
  header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  #scores { display: flex; gap: 14px; }
  .score { display: flex; flex-direction: column; line-height: 1.15; }
  .score span { font-size: 12px; color: var(--muted); }
  .score b { font-size: 26px; font-variant-numeric: tabular-nums; color: var(--sky); }
  .score.us b { color: var(--gold); }
  #trumpBox { display: flex; align-items: center; gap: 8px; }
  #trumpSuit {
    width: 46px; height: 58px; border-radius: 6px; background: var(--card);
    display: grid; place-items: center; font-size: 32px; color: var(--ink);
    box-shadow: 0 0 0 2px var(--gold);
  }
  #trumpSuit.red { color: var(--red); }
  #trumpInfo { font-size: 12px; line-height: 1.35; color: var(--muted); }
  #trumpInfo .mult { color: var(--felt-dark); background: var(--gold); border-radius: 4px; padding: 0 5px; font-weight: 700; }
  .subline { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }
  .subline div { display: flex; gap: 6px; }
  .subline button { background: none; border: 1px solid var(--muted); color: var(--muted); border-radius: 12px; font-size: 11px; padding: 2px 10px; }

  /* Table */
  #table { flex: 1; display: flex; flex-direction: column; gap: 6px; min-height: 300px; }
  .mid { flex: 1; display: grid; grid-template-columns: 62px 1fr 62px; gap: 6px; }
  .seat { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 13px; padding: 4px; border-radius: 8px; border: 2px solid transparent; }
  .seat.turn { border-color: var(--gold); background: rgba(242,194,48,.08); }
  .seat .name { font-weight: 600; }
  .seat.hidden { visibility: hidden; }
  .seat.t0 .name { color: var(--gold); }
  .seat.t1 .name { color: var(--sky); }
  .seat .tag { font-size: 10px; color: var(--muted); }
  .seat .down { font-size: 10px; color: var(--felt-dark); background: var(--muted); border-radius: 3px; padding: 0 4px; }
  .backs { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px; max-width: 54px; }
  #seatTop .backs { max-width: none; }
  .back-mini { width: 10px; height: 14px; border-radius: 2px; background: var(--sky); border: 1px solid #fff4; }

  #center {
    background: rgba(0,0,0,.18); border-radius: 10px; padding: 8px;
    display: flex; flex-direction: column; gap: 5px; overflow-y: auto; max-height: 300px;
  }
  .play { display: flex; align-items: center; gap: 6px; padding: 3px 4px; border-radius: 6px; }
  .play.top { background: rgba(242,194,48,.18); }
  .play .who { width: 34px; font-size: 12px; color: var(--muted); flex-shrink: 0; }
  .play .cards { display: flex; gap: 3px; flex-wrap: wrap; }
  .empty { color: var(--muted); font-size: 13px; text-align: center; margin: auto; }
  .banner { text-align: center; font-weight: 600; color: var(--gold); padding: 4px; }

  /* Cards */
  .card {
    background: var(--card); color: var(--ink); border-radius: 6px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: Georgia, "Times New Roman", serif; font-weight: 700; line-height: 1;
    box-shadow: 0 1px 2px rgba(0,0,0,.4); user-select: none;
  }
  .card.red { color: var(--red); }
  .card.mini { width: 30px; height: 42px; font-size: 13px; }
  .card.mini .s { font-size: 14px; }
  .card.back { background: repeating-linear-gradient(45deg, var(--sky) 0 4px, #2aa9c2 4px 8px); box-shadow: inset 0 0 0 2px var(--card); }
  .card.trump { box-shadow: 0 0 0 2px var(--gold), 0 1px 2px rgba(0,0,0,.4); }

  #status { min-height: 42px; font-size: 14px; line-height: 1.35; text-align: center; }
  #status .note { color: var(--muted); font-size: 13px; }

  #hand { display: flex; justify-content: center; gap: 5px; min-height: 92px; align-items: flex-end; }
  .card.big { width: 52px; height: 76px; font-size: 20px; cursor: pointer; transition: transform .12s; }
  .card.big .s { font-size: 22px; margin-top: 4px; }
  .card.big.sel { transform: translateY(-12px); box-shadow: 0 0 0 3px var(--gold), 0 4px 8px rgba(0,0,0,.5); }

  #actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  #actions button, .panel button {
    font: inherit; font-weight: 600; padding: 13px; border-radius: 10px; border: none;
  }
  #btnPlay { background: var(--gold); color: var(--felt-dark); }
  #btnDown { background: transparent; color: #eaf6f6; border: 2px solid var(--muted); }
  #actions button:disabled { opacity: .35; }
  button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }

  #overlay { position: fixed; inset: 0; background: rgba(4,30,31,.82); display: flex; flex-direction: column; padding: 20px; z-index: 5; overflow-y: auto; }
  #overlay[hidden] { display: none; }
  .panel { margin: auto; background: var(--felt); border: 2px solid var(--gold); border-radius: 14px; padding: 20px; max-width: 380px; width: 100%; line-height: 1.45; }
  .panel h2 { margin: 0 0 8px; font-family: Georgia, serif; font-size: 26px; color: var(--gold); }
  .panel p { margin: 6px 0; }
  .panel ul { padding-left: 18px; margin: 6px 0; font-size: 14px; }
  .panel button { width: 100%; margin-top: 12px; background: var(--gold); color: var(--felt-dark); }
  .panel .choices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .panel .choices button { margin-top: 4px; font-size: 18px; }
  .panel .row { display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; }

  @media (prefers-reduced-motion: reduce) { .card.big { transition: none; } }
  body { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  .panel input { width: 100%; font: inherit; padding: 12px; border-radius: 10px; border: 2px solid var(--muted);
    background: var(--felt-dark); color: #eaf6f6; margin-top: 6px; }
  .panel .code { font-size: 44px; letter-spacing: 8px; font-family: Georgia, serif; color: var(--gold); text-align: center; }
  .panel .seatrow { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid #ffffff22; }
  .panel .muted, .muted { color: var(--muted); font-size: 13px; }
  .panel .err { color: #ffb0b0; min-height: 1em; }
  .panel button.secondary { background: transparent; color: #eaf6f6; border: 2px solid var(--muted); }
  .panel hr { border: none; border-top: 1px solid #ffffff22; margin: 16px 0; }
  .play .who { width: 46px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .score span { max-width: 96px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .seat .name { max-width: 70px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Highlights */
  .seat { transition: border-color .25s, background .25s; }
  .seat.partner { border-color: rgba(242,194,48,.35); border-style: dashed; }
  .seat, #meBar { position: relative; }
  .seat.turn, #meBar.turn { border-color: var(--gold); border-style: solid; background: rgba(242,194,48,.08); }
  /* Glow: a fixed shadow that only fades in and out (cheap for the phone to draw) */
  .seat.turn::after, #meBar.turn::after { content: ''; position: absolute; inset: -2px; border-radius: inherit;
    box-shadow: 0 0 16px 3px rgba(242,194,48,.55); opacity: 0; pointer-events: none;
    animation: glow 1.4s ease-in-out infinite; will-change: opacity; }
  @keyframes glow { 0%, 100% { opacity: 0; } 50% { opacity: 1; } }
  .ontop { font-size: 10px; font-weight: 700; color: var(--felt-dark); background: var(--gold); border-radius: 3px; padding: 1px 5px; }
  .timer { width: 100%; height: 4px; background: #ffffff22; border-radius: 2px; overflow: hidden; }
  .timer i { display: block; height: 100%; background: var(--gold); transform-origin: left; animation: countdown linear forwards; }
  @keyframes countdown { from { transform: scaleX(1); } to { transform: scaleX(0); } }
  #meBar { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 36px; padding: 5px 10px;
    border-radius: 10px; border: 2px solid transparent; font-size: 13px; }
  #meBar .name { font-weight: 600; }
  #meBar .name.t0 { color: var(--gold); }
  #meBar .tag { color: var(--muted); font-size: 11px; }
  #meBar .down { font-size: 10px; color: var(--felt-dark); background: var(--muted); border-radius: 3px; padding: 1px 5px; }
  #meBar .pill { background: var(--gold); color: var(--felt-dark); font-weight: 700; border-radius: 12px; padding: 2px 10px;
    animation: pulse 1s ease-in-out infinite; }
  #meBar .timer { width: 70px; }
  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
  #trumpBox { perspective: 400px; }
  @media (prefers-reduced-motion: reduce) {
    .seat.turn::after, #meBar.turn::after, #meBar .pill, .timer i { animation: none; }
  }

  /* Reactions */
  #actions { grid-template-columns: 1fr 1fr 48px 48px; }
  #btnReact, #btnChat { background: transparent; border: 2px solid var(--muted); font-size: 22px; padding: 8px 0; position: relative; }
  #picker { position: fixed; right: 10px; bottom: calc(80px + env(safe-area-inset-bottom)); z-index: 15;
    background: var(--felt); border: 2px solid var(--gold); border-radius: 14px; padding: 10px;
    display: grid; grid-template-columns: repeat(4, 48px); gap: 6px; box-shadow: 0 6px 20px rgba(0,0,0,.5); }
  #picker[hidden] { display: none; }
  #picker .emo { font-size: 28px; background: rgba(255,255,255,.06); border: none; border-radius: 10px; height: 48px; }
  #picker .signbtn { grid-column: 1 / -1; font: 700 15px Georgia, serif; color: var(--ink); background: var(--card);
    border: 3px solid var(--ink); border-radius: 6px; padding: 8px; transform: rotate(-2deg); margin-top: 4px; }
  #picker .signbtn:nth-of-type(even) { transform: rotate(1.5deg); }
  .react { position: fixed; z-index: 30; pointer-events: none; font-size: 44px; line-height: 1;
    filter: drop-shadow(0 3px 6px rgba(0,0,0,.5)); }
  .react.sign { font: 700 20px Georgia, serif; color: var(--ink); background: var(--card); border: 4px solid var(--ink);
    border-radius: 8px; padding: 10px 14px; white-space: nowrap; box-shadow: 0 0 0 3px var(--gold), 0 8px 20px rgba(0,0,0,.6);
    filter: none; }

  /* Deck in the middle */
  .midcol { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  #deckZone { display: flex; align-items: center; justify-content: center; gap: 12px; min-height: 66px; }
  .deckwrap { position: relative; width: 78px; height: 58px; }
  .trumpslot { position: absolute; left: 0; top: 14px; width: 44px; height: 30px; border-radius: 5px;
    background: var(--card); color: var(--ink); display: grid; place-items: center; font-size: 22px;
    box-shadow: 0 0 0 2px var(--gold), 0 2px 4px rgba(0,0,0,.4); }
  .trumpslot.red { color: var(--red); }
  .stack { position: absolute; left: 38px; top: 8px; width: 30px; height: 42px; }
  .stack .card { position: absolute; inset: 0; }
  .stack.empty { border: 2px dashed #ffffff33; border-radius: 6px; }
  .stack .faceup { box-shadow: 0 0 0 2px var(--gold); }
  .stack .peek { transform: translate(5px, 6px) rotate(8deg); }
  .deckinfo { display: flex; flex-direction: column; font-size: 11px; color: var(--muted); line-height: 1.25; }
  .deckinfo b { font-size: 18px; color: #eaf6f6; }
  .deckinfo .tl { color: var(--gold); }
  #center { flex: 1; }
  .card.reveal { box-shadow: 0 0 0 3px var(--gold), 0 0 24px 6px rgba(242,194,48,.6); }

  #trumpSuit { display: none; }
  #trumpInfo { text-align: right; }
  #trumpInfo b { font-size: 15px; color: #eaf6f6; }
  #trumpInfo b.red { color: #ff8a8a; }
  .mid > .seat { align-self: start; }

  /* Pile of played cards */
  #center { position: relative; overflow: hidden; min-height: 220px; display: block; padding: 0; }
  .pile { position: absolute; inset: 0; }
  .grp { position: absolute; left: 50%; top: 50%; display: flex; transform-origin: center; }
  .grp .card + .card { margin-left: var(--ov, -18px); }
  .grp.top .card { box-shadow: 0 0 0 2px var(--gold), 0 2px 6px rgba(0,0,0,.5); }
  .grp .who { position: absolute; left: 50%; top: -18px; transform: translateX(-50%); white-space: nowrap;
    font-size: 11px; background: rgba(4,30,31,.85); color: #eaf6f6; border-radius: 8px; padding: 1px 7px; }
  .grp.top .who { background: var(--gold); color: var(--felt-dark); font-weight: 700; }
  .card.mid { width: 42px; height: 60px; font-size: 16px; box-shadow: 0 2px 5px rgba(0,0,0,.45); }
  .card.mid .s { font-size: 18px; margin-top: 2px; }
  #center .empty { position: absolute; inset: 0; display: grid; place-items: center; }
  #center .banner { position: absolute; left: 0; right: 0; bottom: 8px; z-index: 50;
    text-shadow: 0 2px 6px rgba(0,0,0,.8); }
  .multbadge { display: flex; flex-direction: column; align-items: center; line-height: 1.1; }
  .multbadge b { font: 700 22px Georgia, serif; color: var(--felt-dark); background: var(--gold); border-radius: 8px;
    padding: 2px 8px; box-shadow: 0 0 12px rgba(242,194,48,.5); }
  .multbadge span { font-size: 10px; color: var(--gold); margin-top: 2px; max-width: 70px; text-align: center; }
  .grp.fd { opacity: .88; }
  /* In a spread, show rank and suit in the corner so overlapped cards stay readable */
  .grp.multi .card.mid:not(.back) { justify-content: flex-start; align-items: flex-start; padding: 4px 0 0 5px; }
  .grp.multi .card.mid:not(.back) .s { margin-top: 1px; font-size: 16px; }

  /* Language switch */
  .langs { display: flex; justify-content: flex-end; gap: 6px; margin-bottom: 4px; }
  .panel .langs button { width: auto; margin: 0; padding: 6px 12px; font-size: 13px; background: transparent;
    color: var(--muted); border: 1px solid var(--muted); border-radius: 14px; }
  .panel .langs button.on { background: var(--gold); color: var(--felt-dark); border-color: var(--gold); }
  .trumpslot.unknown { color: var(--muted); background: #1d5b5d; box-shadow: 0 0 0 2px #ffffff33; }

  /* Chat */
  #chatBadge { position: absolute; top: -6px; right: -6px; min-width: 20px; height: 20px; border-radius: 10px;
    background: #e5484d; color: #fff; font: 700 11px/20px -apple-system, sans-serif; padding: 0 5px; }
  #chatBadge[hidden] { display: none; }
  #chat { position: fixed; left: 10px; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom)); z-index: 45;
    max-width: 460px; margin: 0 auto; height: min(55vh, 420px); display: flex; flex-direction: column;
    background: var(--felt); border: 2px solid var(--gold); border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.6); }
  #chat[hidden] { display: none; }
  .chathead { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border-bottom: 1px solid #ffffff22; }
  .chathead b { font-family: Georgia, serif; color: var(--gold); font-size: 18px; }
  .chathead button { background: none; border: none; color: var(--muted); font-size: 20px; padding: 2px 6px; }
  #chatList { flex: 1; overflow-y: auto; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
  .msg { align-self: flex-start; max-width: 85%; background: rgba(255,255,255,.08); border-radius: 12px 12px 12px 4px;
    padding: 6px 10px; display: flex; flex-direction: column; font-size: 14px; line-height: 1.35; word-break: break-word; }
  .msg b { font-size: 11px; color: var(--sky); }
  .msg.mine { align-self: flex-end; background: rgba(242,194,48,.2); border-radius: 12px 12px 4px 12px; }
  .msg.mine b { color: var(--gold); }
  .chatin { display: flex; gap: 8px; padding: 10px; border-top: 1px solid #ffffff22; }
  .chatin input { flex: 1; font: inherit; font-size: 16px; padding: 10px 12px; border-radius: 10px; border: 2px solid var(--muted);
    background: var(--felt-dark); color: #eaf6f6; min-width: 0; }
  .chatin button { width: 48px; border: none; border-radius: 10px; background: var(--gold); color: var(--felt-dark); font-size: 20px; }
  .react.speech { font: 600 14px -apple-system, "Segoe UI", sans-serif; color: var(--ink); background: var(--card);
    border-radius: 14px; padding: 8px 12px; max-width: 220px; white-space: normal; line-height: 1.3; filter: none;
    box-shadow: 0 4px 14px rgba(0,0,0,.5); }
</style>
</head>
<body>
<div id="app">
  <header>
    <div id="scores"></div>
    <div id="trumpBox"><div id="trumpSuit"></div><div id="trumpInfo"></div></div>
  </header>
  <div class="subline"><span id="roomLabel"></span><div><button id="btnLang">ҚАЗ</button><button id="btnSound">Sound on</button><button id="btnLeave">Leave</button><button id="btnRules">Rules</button></div></div>

  <div id="table">
    <div class="seat" id="seatTop"></div>
    <div class="mid">
      <div class="seat" id="seatLeft"></div>
      <div class="midcol"><div id="deckZone"></div><div id="center"></div></div>
      <div class="seat" id="seatRight"></div>
    </div>
  </div>

  <div id="status"></div>
  <div id="meBar"></div>
  <div id="hand"></div>
  <div id="actions">
    <button id="btnPlay" disabled>Play</button>
    <button id="btnDown" disabled>Put face down</button>
    <button id="btnReact" aria-label="Send a reaction">😄</button>
    <button id="btnChat" aria-label="Chat">💬<span id="chatBadge" hidden></span></button>
  </div>
  <div id="picker" hidden></div>
  <div id="chat" hidden>
    <div class="chathead"><b id="chatTitle">Чат</b><button id="chatClose" aria-label="Close">✕</button></div>
    <div id="chatList"></div>
    <div class="chatin"><input id="chatIn" maxlength="200" autocomplete="off" enterkeyhint="send"><button id="chatSend">➤</button></div>
  </div>
</div>
<div id="overlay" hidden><div class="panel" id="panel"></div></div>
<script type="module">
// ===== ONLINE (Firebase rooms + screen) =====
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getDatabase, ref, set, get, update, push, remove, onValue, onChildAdded, runTransaction, query, limitToLast }
  from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';

// ===== LANGUAGES (Kazakh is the default) =====
const LANGS = { kk: 'ҚАЗ', ru: 'РУС', en: 'ENG' };
const TEXT = {
  kk: {
    chat: 'Чат', chatPh: 'Хабарлама жаз…', send: 'Жіберу', noMsgs: 'Әзірге хабарлама жоқ.', close: 'Жабу',
    title: 'Козел', yourName: 'Атың', namePh: 'Атың', createRoom: 'Бөлме ашу:', players: 'ойыншы',
    orJoin: 'Немесе досыңның бөлмесіне кір', codePh: 'Бөлме коды', join: 'Кіру',
    errName: 'Алдымен атыңды жаз.', errCode: 'Бөлме коды 4 саннан тұрады.', errCreate: 'Бөлме ашылмады: ',
    errJoin: 'Кіру мүмкін болмады: ', errNotFound: 'Бөлме табылмады. Кодты тексер.',

    preview: 'Алдын ала көру: тек компьютермен ойнайсың. Достармен ойнау үшін GitHub сілтемесін аш.',
    room: 'Бөлме', roomN: 'Бөлме {c}', lobbyInfo: '{n} ойыншы. Бұл сілтемені достарыңа жібер:',
    share: 'Сілтемені бөлісу', copied: 'Сілтеме көшірілді', shareText: 'Козел ойынына кел, бөлме {c}',
    team: 'Команда {n}', you: '(сен)', emptySeat: 'Бос (компьютер ойнайды)',
    teamsInfo: '1 және 3 ойыншылар 2 және 4-ке қарсы бір командада.',
    starting: 'Басталуда…', start: 'Ойынды бастау', waitHost: 'Бөлме иесінің ойынды бастауын күтудеміз.',

let lang = 'kk';
function t(key, params = {}) {
  const s = (TEXT[lang] && TEXT[lang][key]) ?? TEXT.en[key] ?? key;
  return s.replace(/\{(\w+)\}/g, (_, k) => (params[k] ?? ''));
}

// ===== RULES (shared) =====
const SUITS = ['♣', '♦', '♥', '♠'];
const RANKS = ['6', '7', '8', '9', 'J', 'Q', 'K', '10', 'A'];   // weakest -> strongest
const POINTS = { A: 11, '10': 10, K: 4, Q: 3, J: 2 };
const HAND = 6;
const mk = (s, r) => ({ s, r, id: RANKS[r] + s });
const isRed = c => c.s === '♦' || c.s === '♥';
const isSpecial = c => c.s === '♣' && c.r === 0;           // 6♣
const cardPts = c => POINTS[RANKS[c.r]] || 0;
const pts = cs => cs.reduce((a, c) => a + cardPts(c), 0);
function beats1(c, o, trump) {
  if (isSpecial(c)) return true;
  if (c.s === o.s) return c.r > o.r;
  return c.s === trump;
}
function beatsSet(def, att, trump) {
  if (def.length !== att.length) return false;
  const go = (d, i) => {
    if (i === att.length) return true;
    for (let k = 0; k < d.length; k++) {
      if (beats1(d[k], att[i], trump) && go(d.slice(0, k).concat(d.slice(k + 1)), i + 1)) return true;
    }
    return false;
  };
  return go(def, 0);
}
function validLead(cs) {
  if (!cs.length) return false;
  return cs.every(c => c.s === cs[0].s) || cs.every(c => c.r === cs[0].r);
}
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

let N = 4, NAMES = [], BOTS = [], G = null, R = null;
let publish = () => {};          // set by the online layer
let botTimer = null;

const nxt = p => (p + 1) % N;
const unitOf = p => (N === 4 ? p % 2 : p);
const unitCount = () => (N === 4 ? 2 : N);
const unitName = u => (N === 4 ? `${NAMES[u]} + ${NAMES[u + 2]}` : NAMES[u]);
const threshold = () => (N === 3 ? 31 : 41);
const dealMult = () => G.mult + (G.doubled ? 1 : 0) + (G.equalScores ? 1 : 0);
const maxLead = () => Math.min(...R.active.map(q => G.hands[q].length));
const canEnd = p => N > 2 && R && R.size > 0 && !R.mustAttack && R.cur === p && R.leader === p;

function penalty(p, wonAny) {
  if (!wonAny) return 6;
  if (p === 0) return 8;
  if (p < threshold()) return 4;
  return 2;
}

function newMatch(n, names, bots) {
  N = n; NAMES = names; BOTS = bots;
  G = { match: Array(unitCount()).fill(0), mult: 1, dealer: Math.floor(Math.random() * N),
        phase: 'idle', notes: [], result: null, dealNo: 0, roundNo: 0 };
  startDeal();
}

function moveCard(card, where) {
  const i = G.deck.findIndex(c => c.id === card.id);
  G.deck.splice(i, 1);
  if (where === 'top') G.deck.push(card);
  else G.deck.splice(Math.min(1, G.deck.length), 0, card);
}

function startDeal() {
  G.result = null;
  G.dealNo += 1;
  G.deck = shuffle(SUITS.flatMap(s => RANKS.map((_, r) => mk(s, r))));
  G.hands = Array.from({ length: N }, () => []);
  for (let i = 0; i < HAND; i++) for (let k = 1; k <= N; k++) G.hands[(G.dealer + k) % N].push(G.deck.pop());
  G.won = Array.from({ length: unitCount() }, () => []);
  G.mode = 'normal'; G.doubled = false; G.faceUp = null;
  G.equalScores = G.match.every(x => x === G.match[0]) && G.match[0] > 0;

  const mid = G.deck[Math.floor(G.deck.length / 2)];
  G.trump = mid.s;
  // Messages are stored as keys; each phone shows them in its own language.
  const notes = [{ k: 'dealt', p: G.dealer, card: mid.id }];
  if (mid.r === 8) {
    G.mode = 'ace'; G.doubled = true; G.faceUp = mid; moveCard(mid, 'top');
    notes.push({ k: 'aceDeal' });
  } else if (mid.r === 0) {
    G.mode = 'six'; G.doubled = true; G.faceUp = mid; moveCard(mid, 'second');
    notes.push({ k: 'sixDeal' });
  }
  if (G.equalScores) notes.push({ k: 'equalDeal', score: G.match.join('-') });
  G.notes = notes;
  // For the screen: the revealed card, and how long the deal animation takes.
  G.reveal = { id: (G.reveal ? G.reveal.id : 0) + 1, card: mid, p: null };
  G.animMs = 6 * N * 60 + 1500;
  G.phase = 'play';
  beginRound(nxt(G.dealer));
}

function beginRound(leader) {
  const active = [...Array(N).keys()].filter(q => G.hands[q].length > 0);
  let l = leader;
  for (let i = 0; i < N && !active.includes(l); i++) l = nxt(l);
  R = { id: ++G.roundNo, active, leader: l, cur: l, holder: l, top: [], size: 0, folded: [], table: [], plays: [],
        mustAttack: false, taker: null };
  step();
}

function takeFromHand(p, cs) {
  const ids = new Set(cs.map(c => c.id));
  G.hands[p] = G.hands[p].filter(c => !ids.has(c.id));
}
function doLead(p, cs) {
  takeFromHand(p, cs);
  R.size = cs.length; R.top = cs; R.holder = p;
  R.table.push(...cs); R.plays.push({ p, cs, down: false });
  advance(false);
}
function doBeat(p, cs) {
  takeFromHand(p, cs);
  R.top = cs; R.holder = p;
  R.table.push(...cs); R.plays.push({ p, cs, down: false });
  if (N === 2) {
    // 2 players: after beating, attack with any number of new cards.
    if (G.hands[p].length === 0) return finishRound();
    R.mustAttack = true;
    return step();
  }
  advance(false);
}
function doAttack(p, cs) {
  takeFromHand(p, cs);
  R.mustAttack = false;
  R.size = cs.length;
  R.top = cs; R.holder = p;
  R.table.push(...cs); R.plays.push({ p, cs, down: false });
  advance(false);
}
function doDown(p, cs) {
  takeFromHand(p, cs);
  if (!R.folded.includes(p)) R.folded.push(p);
  R.table.push(...cs); R.plays.push({ p, cs, down: true });
  advance(true);
}
function doEnd(p) {
  if (!canEnd(p)) return;
  finishRound();
}

function advance(wentDown) {
  if (N === 2) {
    R.cur = nxt(R.cur);
    if (wentDown || G.hands[R.cur].length < R.size) return finishRound();
    return step();
  }
  do { R.cur = nxt(R.cur); } while (!R.active.includes(R.cur));
  if (R.cur === R.leader) {
    const someoneShort = R.active.some(q => G.hands[q].length < R.size);
    if (R.holder === R.leader || someoneShort) return finishRound();
  }
  step();
}

function step() {
  publish();
  const extra = G.animMs || 0;     // wait for dealing animations before a bot moves
  G.animMs = 0;
  clearTimeout(botTimer);
  if (G.phase === 'play' && BOTS[R.cur]) {
    const p = R.cur;
    botTimer = setTimeout(() => aiAct(p), 700 + extra);
  }
}

function finishRound() {
  G.phase = 'roundEnd';
  R.taker = R.holder;
  publish();
  setTimeout(completeRound, 1500);
}

function completeRound() {
  if (G.phase !== 'roundEnd') return;
  const w = R.holder;
  G.won[unitOf(w)].push(...R.table);
  const msg = refill(w);
  const withCards = [...Array(N).keys()].filter(q => G.hands[q].length > 0);
  if (withCards.length < 2) {
    withCards.forEach(q => { G.won[unitOf(q)].push(...G.hands[q]); G.hands[q] = []; });
    return finishDeal(w);
  }
  G.notes = msg ? [msg] : [];
  G.phase = 'play';
  beginRound(w);
}

function refill(first) {
  let p = first, lastDrawn = null, lastDeck = null, drawn = 0;
  while (G.deck.length && G.hands.some(h => h.length < HAND)) {
    if (G.hands[p].length < HAND) {
      const c = G.deck.pop();
      G.hands[p].push(c);
      drawn++;
      if (G.faceUp && c.id === G.faceUp.id) G.faceUp = null;
      lastDrawn = { c, p };
      if (!G.deck.length) lastDeck = { c, p };
    }
    p = nxt(p);
  }
  let pick = null;
  if (G.mode === 'normal') pick = lastDrawn;
  else if (G.mode === 'six') pick = lastDeck;
  G.animMs = drawn * 60 + (pick ? 1500 : 300);
  if (pick) {
    const changed = pick.c.s !== G.trump;
    G.trump = pick.c.s;
    G.reveal = { id: (G.reveal ? G.reveal.id : 0) + 1, card: pick.c, p: pick.p };
    return { k: changed ? 'openedNew' : 'openedSame', p: pick.p, card: pick.c.id, suit: pick.c.s };
  }
  return null;
}

function finishDeal(lastWinner) {
  const units = [...Array(unitCount()).keys()];
  const p = G.won.map(pts);
  const best = Math.max(...p);
  const top = units.filter(u => p[u] === best);
  const res = { team: N === 4, points: p, tie: top.length > 1, lines: [] };
  if (res.tie) {
    G.mult += 1;
    res.nextMult = G.mult;
  } else {
    const mult = dealMult();
    res.winner = top[0];
    for (const u of units) {
      if (u === top[0]) continue;
      const wonAny = G.won[u].length > 0;
      const base = penalty(p[u], wonAny);
      const why = !wonAny ? 'none' : p[u] === 0 ? 'humiliated' : p[u] < threshold() ? 'under' : 'over';
      G.match[u] += base * mult;
      res.lines.push({ u, why, base, mult, thr: threshold() });
    }
    G.mult = 1;
  }
  G.dealer = lastWinner;

  const high = Math.max(...G.match), low = Math.min(...G.match);
  const earlyEnd = !(high > 24) && high > 12 && low === 0;
  const over = high > 24 || earlyEnd;
  res.over = over;
  if (over) {
    res.loser = units.find(u => G.match[u] === high);
    if (earlyEnd) res.earlyZero = units.find(u => G.match[u] === 0);
  }
  res.score = G.match.slice();
  res.nextDealer = over ? null : lastWinner;
  G.result = res;
  G.phase = over ? 'matchEnd' : 'dealEnd';
  publish();
}

// ---------- Computer players ----------
function costKey(c) {
  return c.r + cardPts(c) * 0.6 + (c.s === G.trump ? 12 : 0) + (isSpecial(c) ? 40 : 0);
}
function combos(arr, n) {
  const out = [];
  const go = (s, cur) => {
    if (cur.length === n) { out.push(cur.slice()); return; }
    for (let i = s; i < arr.length; i++) { cur.push(arr[i]); go(i + 1, cur); cur.pop(); }
  };
  go(0, []);
  return out;
}
const sumCost = cs => cs.reduce((a, c) => a + costKey(c), 0);
function bestBeat(h) {
  const opts = combos(h, R.size).filter(cs => beatsSet(cs, R.top, G.trump));
  if (!opts.length) return null;
  opts.sort((a, b) => sumCost(a) - sumCost(b));
  const best = opts[0];
  const worth = pts(R.table) >= 10 || sumCost(best) < 20 * R.size || G.deck.length === 0;
  return worth ? best : null;
}
function chooseLead(h) {
  const limit = maxLead();
  const byRank = {};
  h.forEach(c => (byRank[c.r] = byRank[c.r] || []).push(c));
  for (const r of [8, 7]) if (byRank[r] && byRank[r].length >= 2) return byRank[r].slice(0, limit);
  const plain = h.filter(c => c.s !== G.trump && !isSpecial(c));
  const pool = plain.length ? plain : h;
  return [pool.slice().sort((a, b) => costKey(a) - costKey(b))[0]];
}
function aiAct(p) {
  if (G.phase !== 'play' || R.cur !== p) return;
  const h = G.hands[p];
  if (R.mustAttack) return doAttack(p, chooseLead(h));
  if (R.size === 0) return doLead(p, chooseLead(h));
  const partnerOnTop = unitOf(R.holder) === unitOf(p);
  if (canEnd(p)) {
    const b = partnerOnTop ? null : bestBeat(h);
    return b ? doBeat(p, b) : doEnd(p);
  }
  if (!R.folded.includes(p) && !partnerOnTop) {
    const b = bestBeat(h);
    if (b) return doBeat(p, b);
  }
  let order;
  if (partnerOnTop) {
    const give = c => cardPts(c) - (c.s === G.trump ? 20 : 0) - (isSpecial(c) ? 50 : 0);
    order = h.slice().sort((a, b) => give(b) - give(a));
  } else {
    order = h.slice().sort((a, b) => costKey(a) - costKey(b));
  }
  doDown(p, order.slice(0, R.size));
}

// A move sent by a human player. The host checks it against the rules.
function applyMove(m) {
  if (!G || G.phase !== 'play' || R.cur !== m.seat || BOTS[m.seat]) return;
  const hand = G.hands[m.seat];
  const ids = Array.isArray(m.cards) ? m.cards : [];
  const cs = ids.map(id => hand.find(c => c.id === id));
  if (cs.some(c => !c) || new Set(ids).size !== ids.length) return;
  const p = m.seat;
  switch (m.type) {
    case 'lead':
      if (R.size === 0 && validLead(cs) && cs.length <= maxLead()) doLead(p, cs);
      break;
    case 'attack':
      if (R.mustAttack && validLead(cs) && cs.length <= maxLead()) doAttack(p, cs);
      break;
    case 'beat':
      if (R.size > 0 && !R.mustAttack && !R.folded.includes(p) && cs.length === R.size
          && beatsSet(cs, R.top, G.trump)) doBeat(p, cs);
      break;
    case 'down':
      if (R.size > 0 && !R.mustAttack && !canEnd(p) && cs.length === R.size) doDown(p, cs);
      break;
    case 'end':
      doEnd(p);
      break;
  }
}

async function joinRoom(c) {
  const snap = await get(ref(db, `rooms/${c}`));
  if (!snap.exists()) return showHome(c, t('errNotFound'));
  const room = snap.val();
  const list = seatList(room.seats, room.meta.n);
  if (list.some(s => s && s.id === myId)) return enterRoom(c);       // rejoining
  if (room.meta.status !== 'lobby') return showHome(c, t('errStarted'));
  let joined = false;
  await runTransaction(ref(db, `rooms/${c}/seats`), cur => {
    if (cur === null) return null;
    const arr = seatList(cur, room.meta.n);
    const free = arr.findIndex(s => !s);
    if (free < 0) { joined = false; return; }       // full: abort
    cur[free] = { id: myId, name: myName };
    joined = true;
    return cur;
  });
  if (!joined) return showHome(c, t('errFull'));
  enterRoom(c);
}

function enterRoom(c) {
  leaveListeners();
  code = c; engineReady = false; V = null; lastKey = ''; prev = null; heldTrump = null;

  $('roomLabel').textContent = t('roomN', { c });

    isHost = meta.host === myId;
    renderAll();
  }));
  unsubs.push(onValue(roomRef('seats'), s => {
    seats = seatList(s.val(), meta ? meta.n : 4);
    mySeat = seats.findIndex(x => x && x.id === myId);
    renderAll();
  }));
  const enteredAt = Date.now();
  chatMsgs = []; unread = 0; renderChat();
  unsubs.push(onChildAdded(query(roomRef('chat'), limitToLast(50)), s => {
    const m = s.val();
    if (!m || typeof m.text !== 'string') return;
    chatMsgs.push(m);
    if (chatMsgs.length > 50) chatMsgs.shift();
    if (m.t > enteredAt - 3000 && m.by !== myId) {
      if (!chatOpen) unread++;
      sfx('pop');
      if (!chatOpen) bubbleAt(m.seat, m.text.length > 60 ? m.text.slice(0, 58) + '…' : m.text, 'speech', 3500);
    }
    renderChat();
  }));
  unsubs.push(onChildAdded(query(roomRef('reactions'), limitToLast(5)), s => {
    const m = s.val();
    if (m && m.t > enteredAt - 3000) showReaction(m.seat, m.r);
  }));
  unsubs.push(onValue(roomRef('game'), s => {
    const raw = s.val();
    V = raw ? JSON.parse(raw) : null;
    pending = false;
    if (V && isHost && !engineReady) { restoreEngine(JSON.parse(raw)); startHosting(); }
    const key = V && V.R ? `${V.R.plays.length}-${V.R.cur}-${V.R.mustAttack}-${V.G.phase}` : '';
    if (key !== lastKey) { sel.clear(); lastKey = key; }
    renderAll();
  }));
}

    lines.push(t(r.team ? 'wonDealTeam' : 'wonDeal', { u: x.uName(r.winner) }));
    for (const l of r.lines) {
      const calc = l.mult > 1 ? `${l.base} × ${l.mult} = ${l.base * l.mult}` : `${l.base}`;
      lines.push(`${x.uName(l.u)}: ${t('why_' + l.why, { t: l.thr })}. +${calc}`);
    }
  }
  if (r.earlyZero != null) lines.push(t('early', { u: x.uName(r.earlyZero) }));
  const over = V.G.phase === 'matchEnd';
  const title = over ? t(r.team ? 'kozelTeam' : 'kozel', { u: x.uName(r.loser) }) : t('dealOver');
  const score = r.score.map((v, u) => `${esc(x.uName(u))} ${v}`).join(', ');
  const hostName = seats[0] ? esc(seats[0].name) : '';
  showOverlay(`<h2>${esc(title)}</h2>${rows}${lines.map(l => `<p>${esc(l)}</p>`).join('')}
    <p>${over ? t('finalScore') : t('score')}: ${score}.</p>
    ${r.nextDealer != null ? `<p>${esc(t('nextDealer', { name: x.names[r.nextDealer] }))}</p>` : ''}
    ${isHost ? `<button id="goBtn">${over ? t('again') : t('nextDeal')}</button>`
             : `<p class="muted">${t('waitFor', { name: hostName })}</p>`}
    ${over ? `<button class="secondary" id="leaveBtn">${t('leaveRoom')}</button>` : ''}`);
  if ($('goBtn')) $('goBtn').onclick = () => {
    $('goBtn').disabled = true;
    if (V.G.phase === 'dealEnd') startDeal(); else newMatch(N, NAMES, BOTS);
  };
  if ($('leaveBtn')) $('leaveBtn').onclick = () => { leaveRoom(); showHome(); };
}

// One message from the game, in this phone's language
function noteText(m, names) {
  if (!m) return '';
  return t(m.k, { name: names[m.p] ?? '', card: m.card, suit: m.suit, score: m.score });
}

const SEATS = { 2: { 1: 'Top' }, 3: { 1: 'Left', 2: 'Right' }, 4: { 1: 'Left', 2: 'Top', 3: 'Right' } };
const TURN_SECONDS = 30;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------- Sound & haptics ----------
let actx = null, soundOn = store.get('kozelSound') !== 'off';
function audio() {
  if (!actx) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; actx = new C(); }
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
document.addEventListener('pointerdown', () => { if (soundOn) audio(); });   // iOS needs a tap first
function tone(freq, dur, type = 'sine', vol = 0.12, when = 0) {
  const a = audio(); if (!a) return;
  const t = a.currentTime + when, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + 0.02);
}
const noiseCache = {};
function snap(vol = 0.25, freq = 2400, dur = 0.07, when = 0) {
  const a = audio(); if (!a) return;
  const t = a.currentTime + when;
  const key = Math.round(dur * 100);
  if (!noiseCache[key]) {
    const len = Math.floor(a.sampleRate * dur);
    const b = a.createBuffer(1, len, a.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len) ** 2;
    noiseCache[key] = b;
  }
  const buf = noiseCache[key];
  const src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  src.buffer = buf; f.type = 'bandpass'; f.frequency.value = freq; g.gain.value = vol;
  src.connect(f).connect(g).connect(a.destination); src.start(t);
}
const SFX = {
  card: () => snap(0.3, 2400),
  down: () => snap(0.15, 900, 0.09),
  deal: (i = 0) => snap(0.12, 3200, 0.04, i * 0.09),
  turn: () => { tone(660, 0.12); tone(990, 0.18, 'sine', 0.12, 0.12); },
  win: () => [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.16, 'triangle', 0.1, i * 0.08)),
  lose: () => { tone(392, 0.18, 'sine', 0.08); tone(311, 0.26, 'sine', 0.08, 0.14); },
  flip: () => { snap(0.25, 1800, 0.09); tone(740, 0.15, 'triangle', 0.06, 0.05); },
  pop: () => { tone(880, 0.08, 'sine', 0.1); tone(1320, 0.1, 'sine', 0.08, 0.05); },
};
const sfx = (name, arg) => { if (soundOn) try { SFX[name](arg); } catch {} };
const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch {} };

// ---------- Flying cards ----------
// A copy of the card flies over everything, so it isn't clipped by the table area.
function ghostOf(el, rect) {
  const g = el.cloneNode(true);
  g.classList.remove('sel');
  Object.assign(g.style, { position: 'fixed', left: rect.left + 'px', top: rect.top + 'px', width: rect.width + 'px',
    height: rect.height + 'px', margin: 0, zIndex: 20, pointerEvents: 'none', visibility: 'visible' });
  document.body.appendChild(g);
  return g;
}
const center = r => ({ x: r.left + r.width / 2, y: r.top + r.height / 2 });
function flyIn(el, fromRect, { delay = 0, flip = false, dur = 420 } = {}) {
  if (reduceMotion || !fromRect) return;
  const to = el.getBoundingClientRect(), a = center(fromRect), b = center(to);
  const g = ghostOf(el, to);
  el.style.visibility = 'hidden';
  const anim = g.animate([
    { transform: `translate(${a.x - b.x}px, ${a.y - b.y}px) scale(.5)${flip ? ' rotateY(180deg)' : ''}`, opacity: 0.5 },
    { transform: 'none', opacity: 1 }],
    { duration: dur, delay, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'backwards' });
  const done = () => { g.remove(); el.style.visibility = ''; };
  anim.onfinish = done; anim.oncancel = done;
}
function flyOut(el, toRect, { delay = 0, dur = 520 } = {}) {
  if (reduceMotion || !toRect) return;
  const from = el.getBoundingClientRect(), a = center(from), b = center(toRect);
  const g = ghostOf(el, from);
  el.style.visibility = 'hidden';
  const anim = g.animate([
    { transform: 'none', opacity: 1 },
    { transform: `translate(${b.x - a.x}px, ${b.y - a.y}px) scale(.35)`, opacity: 0 }],
    { duration: dur, delay, easing: 'cubic-bezier(.5,0,.75,0)', fill: 'forwards' });
  const done = () => g.remove();
  anim.onfinish = done; anim.oncancel = done;
}
function flash(el, color = 'rgba(242,194,48,.9)') {
  if (reduceMotion || !el) return;
  el.animate([{ boxShadow: '0 0 0 0 transparent' }, { boxShadow: `0 0 22px 6px ${color}` }, { boxShadow: '0 0 0 0 transparent' }],
    { duration: 900, iterations: 2 });
}

// ---------- Dealing & reveal ----------
function dealAnimation(x, order, freshDeal, p0) {
  const { g, me } = x;
  if (reduceMotion) return;
  const deckEl = $('deckStack');
  if (!deckEl) return;
  const from = deckEl.getBoundingClientRect();
  // Targets: your new hand cards (in screen order) and each opponent's new card backs
  const myCards = [...$('hand').querySelectorAll('.card')]
    .filter(el => freshDeal || !p0 || !p0.hand.has(el.dataset.id));
  const backsFor = {};
  g.hands.forEach((h, p) => {
    if (p === me) return;
    const all = [...x.seatEl(p).querySelectorAll('.back-mini')];
    backsFor[p] = freshDeal || !p0 ? all : all.slice(p0.counts[p] ?? 0);
  });
  myCards.forEach(el => el.style.visibility = 'hidden');
  Object.values(backsFor).forEach(list => list.forEach(el => el.style.visibility = 'hidden'));

  const myQueue = myCards.slice(), theirQueue = {};
  for (const p in backsFor) theirQueue[p] = backsFor[p].slice();
  order.forEach((p, i) => {
    const target = p === me ? myQueue.shift() : theirQueue[p]?.shift();
    if (!target) return;
    const to = target.getBoundingClientRect();
    const ghost = document.createElement('div');
    ghost.className = 'card mini back';
    Object.assign(ghost.style, { position: 'fixed', left: from.left + 'px', top: from.top + 'px',
      width: from.width + 'px', height: from.height + 'px', zIndex: 20, pointerEvents: 'none' });
    document.body.appendChild(ghost);
    const a = center(from), b = center(to);
    const sc = to.width / from.width;
    const anim = ghost.animate([
      { transform: 'none', opacity: 1 },
      { transform: `translate(${b.x - a.x}px, ${b.y - a.y}px) scale(${sc}) rotate(${p === me ? 0 : 20}deg)`, opacity: 1 }],
      { duration: 280, delay: i * 60, easing: 'cubic-bezier(.3,.7,.3,1)', fill: 'both' });
    setTimeout(() => sfx('deal'), i * 60);
    const done = () => { ghost.remove(); target.style.visibility = ''; };
    anim.onfinish = done; anim.oncancel = done;
  });
}

function revealAnimation(x, rv, delay) {
  if (reduceMotion || !rv || !rv.card) return;
  const deckEl = $('deckStack');
  const deck = (deckEl || $('deckZone')).getBoundingClientRect();
  const table = $('table').getBoundingClientRect();
  const W = 52, H = 76;
  const cx = table.left + table.width / 2, cy = table.top + table.height / 2;
  const make = (cls, html) => {
    const el = document.createElement('div');
    el.className = cls; el.innerHTML = html;
    Object.assign(el.style, { position: 'fixed', left: cx - W / 2 + 'px', top: cy - H / 2 + 'px',
      width: W + 'px', height: H + 'px', zIndex: 25, pointerEvents: 'none' });
    document.body.appendChild(el);
    return el;
  };
  const back = make('card big back', '');
  const face = make(`card big reveal${isRed(rv.card) ? ' red' : ''}`,
    `<span>${RANKS[rv.card.r]}</span><span class="s">${rv.card.s}</span>`);
  const d = center(deck);
  const start = `translate(${d.x - cx}px, ${d.y - cy}px) scale(.55)`;
  back.animate([{ transform: start }, { transform: 'scale(1.5) rotateY(90deg)' }],
    { duration: 300, delay, easing: 'ease-in', fill: 'backwards' }).onfinish = () => back.remove();
  // Where the card goes afterwards: to the player who picked it up, or back into the deck
  const dest = rv.p == null ? deck : (rv.p === x.me ? $('hand') : x.seatEl(rv.p)).getBoundingClientRect();
  const e = center(dest);
  face.style.opacity = 0;
  const anim = face.animate([
    { transform: 'scale(1.5) rotateY(90deg)', opacity: 1 },
    { transform: 'scale(1.7) rotateY(0deg)', opacity: 1, offset: 0.15 },
    { transform: 'scale(1.7)', opacity: 1, offset: 0.7 },
    { transform: `translate(${e.x - cx}px, ${e.y - cy}px) scale(.45)`, opacity: 0 }],
    { duration: 1150, delay: delay + 300, easing: 'ease-in-out', fill: 'forwards' });
  setTimeout(() => sfx('flip'), delay + 300);
  anim.onfinish = () => face.remove();
  anim.oncancel = () => face.remove();
}

// ---------- Game screen ----------
let prev = null, turnKey = '', turnStart = 0, busyUntil = 0;
let heldTrump = null;                    // what the screen shows while the trump card is being opened
const shown = () => heldTrump || V.G;
const suitTxt = s => s || '?';   // no moves while cards are being dealt

function ctx() {
  const { N: n, G: g, R: r } = V;
  const names = V.NAMES.map((nm, p) => (V.BOTS && V.BOTS[p] ? `${t('bot')} ${'ABCD'[p]}` : nm));
  const me = mySeat;
  const x = { n, names, g, r, me };
  x.uOf = p => (n === 4 ? p % 2 : p);
  x.uName = u => (n === 4 ? `${names[u]} + ${names[u + 2]}` : names[u]);
  x.maxLead = () => Math.min(...r.active.map(q => g.hands[q].length));
  x.canEnd = p => n > 2 && r.size > 0 && !r.mustAttack && r.cur === p && r.leader === p;
  x.seatEl = p => (p === me ? $('meBar') : $('seat' + SEATS[n][(p - me + n) % n]));
  x.myTurn = g.phase === 'play' && r.cur === me && !pending && performance.now() >= busyUntil;
  return x;
}

function cardHTML(c, trump, cls = 'mini', faceDown = false) {
  if (faceDown) return `<div class="card ${cls} back"></div>`;
  return `<div class="card ${cls}${isRed(c) ? ' red' : ''}${c.s === trump ? ' trump' : ''}" data-id="${c.id}"><span>${RANKS[c.r]}</span><span class="s">${c.s}</span></div>`;
}
const timerHTML = () => {
  const el = (performance.now() - turnStart) / 1000;
  return `<div class="timer"><i style="animation-duration:${TURN_SECONDS}s;animation-delay:-${el.toFixed(2)}s"></i></div>`;
};

function renderGame() {
  if (!V || mySeat < 0) return;
  const x = ctx(), { n, names, g, r, me } = x;

  // Keep showing the old trump until the new card has been opened on screen
  const rv = g.reveal, p0 = prev;
  const freshDeal = p0 ? p0.dealNo !== g.dealNo : (g.deck.length === 36 - 6 * n && r.plays.length === 0);
  if (!reduceMotion && rv && (freshDeal || (p0 && p0.revealId !== rv.id))) {
    heldTrump = freshDeal ? { trump: null, mode: 'normal', doubled: false, faceUp: null, notes: [] }
                          : { trump: p0.trump, mode: p0.mode, doubled: p0.doubled, faceUp: p0.faceUp, notes: p0.notes };
  }
  const d = shown();

  const tk = `${r.id}-${r.plays.length}-${r.cur}-${g.phase}-${r.mustAttack}`;
  const turnChanged = tk !== turnKey;
  if (turnChanged) { turnKey = tk; turnStart = performance.now(); }

  // Header
  $('scores').innerHTML = [...Array(n === 4 ? 2 : n).keys()].map(u =>
    `<div class="score${u === x.uOf(me) ? ' us' : ''}"><span>${esc(x.uName(u))}</span><b>${g.match[u]}</b></div>`).join('');
  const ts = $('trumpSuit');
  ts.textContent = suitTxt(d.trump);
  ts.className = isRed({ s: d.trump }) ? 'red' : '';
  const mult = g.mult + (d.doubled ? 1 : 0) + (g.equalScores ? 1 : 0);
  const modeText = d.mode === 'ace' ? t('modeAce') : d.mode === 'six' ? t('modeSix') : t('modeNormal');
  $('trumpInfo').innerHTML = `<b class="${isRed({ s: d.trump }) ? 'red' : ''}">${t('trump', { s: suitTxt(d.trump) })}</b><br>${modeText}` +
    (d.faceUp ? `<br>${t('faceUp', { c: d.faceUp.id })}` : '') + (mult > 1 ? `<br><span class="mult">×${mult}</span>` : '');

  // Other players
  const onTop = p => r.size > 0 && r.holder === p && g.phase === 'play';
  for (const pos of ['Top', 'Left', 'Right']) { const el = $('seat' + pos); el.className = 'seat hidden'; el.innerHTML = ''; }
  for (let rel = 1; rel < n; rel++) {
    const p = (me + rel) % n, el = $('seat' + SEATS[n][rel]);
    const partner = n === 4 && rel === 2;
    const turn = r.cur === p && g.phase === 'play';
    el.className = `seat ${partner ? 't0 partner' : 't1'}${turn ? ' turn' : ''}`;
    el.innerHTML = `<div class="name">${esc(names[p])}</div>
      <div class="tag">${partner ? t('partner') : t('opponent')}${g.dealer === p ? ', ' + t('dealerTag') : ''}</div>
      <div class="backs">${'<div class="back-mini"></div>'.repeat(g.hands[p].length)}</div>
      ${onTop(p) ? `<div class="ontop">${t('onTop')}</div>` : ''}
      ${n > 2 && r.folded.includes(p) ? `<div class="down">${t('faceDown')}</div>` : ''}
      ${turn ? timerHTML() : ''}`;
  }

  // Deck in the middle, with the trump under it
  const left = g.deck.length;
  const layers = Math.min(left, 5);
  let stack = '';
  if (d.faceUp && d.mode === 'six') stack += `<div class="card mini faceup peek${isRed(d.faceUp) ? ' red' : ''}"><span>${RANKS[d.faceUp.r]}</span><span class="s">${d.faceUp.s}</span></div>`;
  for (let i = 0; i < layers; i++) stack += `<div class="card mini back layer" style="transform:translate(${-i * 1.5}px,${-i * 1.5}px)"></div>`;
  if (d.faceUp && d.mode === 'ace') stack += `<div class="card mini faceup ontopcard${isRed(d.faceUp) ? ' red' : ''}" style="transform:translate(${-layers * 1.5}px,${-layers * 1.5}px)"><span>${RANKS[d.faceUp.r]}</span><span class="s">${d.faceUp.s}</span></div>`;
  $('deckZone').innerHTML = `<div class="deckwrap">
      <div class="trumpslot${isRed({ s: d.trump }) ? ' red' : ''}${d.trump ? '' : ' unknown'}"><span>${suitTxt(d.trump)}</span></div>
      <div class="stack${left ? '' : ' empty'}" id="deckStack">${stack}</div>
    </div>
    <div class="deckinfo"><b>${left}</b><span>${left ? t('inDeck') : t('deckEmpty')}</span><span class="tl">${t('trump', { s: suitTxt(d.trump) })}</span></div>` +
    (mult > 1 ? `<div class="multbadge"><b>×${mult}</b><span>${[
        g.mult > 1 ? (g.mult > 2 ? t('whyTies', { n: g.mult - 1 }) : t('whyTie')) : '',
        d.doubled ? (d.mode === 'ace' ? t('whyAce') : t('whySix')) : '',
        g.equalScores ? t('whyEqual') : ''].filter(Boolean).join(' + ')}</span></div>` : '');

  // Table
  const c = $('center');
  if (!r.plays.length) {
    c.innerHTML = `<div class="empty">${r.cur === me ? t('yourLead') : esc(t('leads', { name: names[r.cur] }))}</div>`;
  } else {
    // Cards pile up on top of each other, nudged toward whoever played them
    const topIdx = r.plays.map(p => !p.down).lastIndexOf(true);
    const last = r.plays.length - 1;
    const DIR = { 0: [0, 1], 1: [-1, 0], 2: [0, -1], 3: [1, 0] };          // you, left, top, right
    const dirOf = p => {
      const rel = (p - me + n) % n;
      const pos = rel === 0 ? 0 : { Left: 1, Top: 2, Right: 3 }[SEATS[n][rel]];
      return DIR[pos];
    };
    const jitter = (i, k) => { const v = Math.sin((r.id * 31 + i * 17 + k * 7) * 12.9898) * 43758.5453; return v - Math.floor(v) - 0.5; };
    c.innerHTML = `<div class="pile">${r.plays.map((pl, i) => {
      const [dx, dy] = dirOf(pl.p);
      // Face-down cards are pushed out toward the player, under everything else;
      // the cards to beat always stay on top in the middle.
      const isTop = i === topIdx;
      const out = isTop ? 4 : pl.down ? 50 : 34;
      const tx = dx * out + jitter(i, 1) * (isTop ? 6 : 14), ty = dy * out * 0.85 + jitter(i, 2) * (isTop ? 6 : 12);
      const rot = jitter(i, 3) * (isTop ? 6 : 18);
      const tag = i === last || isTop;
      const z = isTop ? 100 : pl.down ? i + 1 : i + 20;
      // Spread several cards so each one is readable (they fit the table width)
      const k = pl.cs.length;
      const ov = k > 1 ? Math.max(-22, Math.min(3, (190 - 42 * k) / (k - 1))) : 0;
      return `<div class="grp${isTop ? ' top' : ''}${pl.down ? ' fd' : ''}${k > 1 ? ' multi' : ''}" style="--ov:${ov.toFixed(1)}px;z-index:${z};transform:translate(-50%,-50%) translate(${tx.toFixed(1)}px,${ty.toFixed(1)}px) rotate(${rot.toFixed(1)}deg)">
        ${pl.cs.map(cd => cardHTML(cd, d.trump, 'mid', pl.down)).join('')}
        ${tag ? `<span class="who">${pl.p === me ? t('youShort') : esc(names[pl.p])}</span>` : ''}</div>`;
    }).join('')}</div>` +
      (g.phase === 'roundEnd' && r.taker != null ? `<div class="banner">${esc(r.taker === me ? t('youTake') : t('takes', { name: names[r.taker] }))}</div>` : '');
  }

  // Status line
  let turn = '';
  if (g.phase === 'play') {
    if (r.cur === me) {
      const prm = { name: names[r.holder], cards: r.top.map(cd => cd.id).join(' '), n: r.size };
      if (r.size === 0) turn = t('stLead');
      else if (r.mustAttack) turn = t('stAttack');
      else if (x.canEnd(me)) turn = t('stEnd', prm);
      else if (r.folded.includes(me)) turn = t('stFolded', prm);
      else turn = t('stBeat', prm);
    } else turn = t('turnOf', { name: names[r.cur] });
  }
  const notes = (d.notes || []).map(m => noteText(m, names)).join(' ');
  $('status').innerHTML = `<div>${esc(turn)}</div>${notes ? `<div class="note">${esc(notes)}</div>` : ''}`;

  renderHandArea();
  animateChanges(x, turnChanged);
}

// Only the bottom area: used when you tap cards, so table animations keep running.
function renderHandArea() {
  const x = ctx(), { n, names, g, r, me } = x;
  const d = shown();
  const myTurnNow = g.phase === 'play' && r.cur === me;
  const mb = $('meBar');
  mb.className = myTurnNow ? 'turn' : '';
  mb.innerHTML = `<span class="name ${n === 4 ? 't0' : ''}">${esc(names[me])}</span>
    ${myTurnNow ? `<span class="pill">${t('yourTurn')}</span>` + timerHTML() : ''}
    ${r.size > 0 && r.holder === me && g.phase === 'play' ? `<span class="ontop">${t('onTop')}</span>` : ''}
    ${n > 2 && r.folded.includes(me) && g.phase === 'play' ? `<span class="down">${t('faceDown')}</span>` : ''}
    ${g.dealer === me ? `<span class="tag">${t('dealer')}</span>` : ''}`;

  const order = s => (s === d.trump ? 9 : SUITS.indexOf(s));
  const hand = g.hands[me].slice().sort((a, b) => order(a.s) - order(b.s) || a.r - b.r);
  $('hand').innerHTML = hand.map(cd => cardHTML(cd, d.trump, 'big' + (sel.has(cd.id) ? ' sel' : ''))).join('');
  $('hand').querySelectorAll('.card').forEach(el => el.onclick = () => {
    if (!x.myTurn) return;
    const id = el.dataset.id;
    sel.has(id) ? sel.delete(id) : sel.add(id);
    buzz(8);
    renderHandArea();
  });

  const mine = g.hands[me].filter(cd => sel.has(cd.id));
  const bp = $('btnPlay'), bd = $('btnDown');
  if (x.myTurn && (r.size === 0 || r.mustAttack)) {
    bp.textContent = t('play'); bp.disabled = !validLead(mine) || mine.length > x.maxLead();
    bd.textContent = t('down'); bd.disabled = true;
    bp.onclick = () => sendMove(r.size === 0 ? 'lead' : 'attack');
  } else if (x.myTurn && x.canEnd(me)) {
    bp.textContent = t('beat'); bp.disabled = !(mine.length === r.size && beatsSet(mine, r.top, g.trump));
    bd.textContent = t('end'); bd.disabled = false;
    bp.onclick = () => sendMove('beat'); bd.onclick = () => sendMove('end');
  } else {
    bp.textContent = t('beat');
    bp.disabled = !(x.myTurn && !r.folded.includes(me) && mine.length === r.size && beatsSet(mine, r.top, g.trump));
    bd.textContent = t('down'); bd.disabled = !(x.myTurn && mine.length === r.size);
    bp.onclick = () => sendMove('beat'); bd.onclick = () => sendMove('down');
  }
}

// Compare with the last screen and animate whatever changed.
function animateChanges(x, turnChanged) {
  const { g, r, me } = x;
  const handIds = g.hands[me].map(cd => cd.id);
  const ds = shown();
  const now = { roundId: r.id, dealNo: g.dealNo, plays: r.plays.length, phase: g.phase, trump: ds.trump,
                mode: ds.mode, doubled: ds.doubled, faceUp: ds.faceUp, notes: ds.notes,
                hand: new Set(handIds), counts: g.hands.map(h => h.length) };
  const p0 = prev;
  prev = now;

  // Trump card flips over on a new deal or a trump change
  if (p0 && p0.trump !== ds.trump && ds.trump) {
    if (!reduceMotion) $('trumpSuit').animate([{ transform: 'rotateY(90deg) scale(1.2)' }, { transform: 'none' }],
      { duration: 500, easing: 'cubic-bezier(.2,.8,.2,1)' });
  }

  // New plays slide in from the player who made them
  const firstNew = p0 && p0.roundId === r.id ? p0.plays : 0;
  if (r.plays.length > firstNew) {
    const rows = $('center').querySelectorAll('.grp');
    for (let i = firstNew; i < r.plays.length; i++) {
      const pl = r.plays[i], from = (pl.p === me ? $('hand') : x.seatEl(pl.p)).getBoundingClientRect();
      rows[i]?.querySelectorAll('.card').forEach((el, k) => flyIn(el, from, { delay: k * 60, flip: pl.down }));
      sfx(pl.down ? 'down' : 'card');
    }
  }

  // Round over: flash the winner, then cards fly to them
  if (g.phase === 'roundEnd' && !(p0 && p0.phase === 'roundEnd' && p0.roundId === r.id)) {
    const wEl = x.seatEl(r.holder);
    flash(wEl);
    const mine = x.uOf(r.holder) === x.uOf(me);
    sfx(mine ? 'win' : 'lose');
    if (r.holder === me) buzz([20, 40, 20]);
    const to = wEl.getBoundingClientRect();
    $('center').querySelectorAll('.card').forEach((el, k) => flyOut(el, to, { delay: 450 + k * 20, dur: 400 }));
  }

  // Dealing: cards fly from the deck to each player, one at a time around the table
  const n = x.n;
  const freshDeal = p0 ? p0.dealNo !== g.dealNo
                       : (g.deck.length === 36 - 6 * n && r.plays.length === 0);
  let order = [];
  if (freshDeal) {
    for (let i = 0; i < 6; i++) for (let k = 1; k <= n; k++) order.push((g.dealer + k) % n);
  } else if (p0) {
    const need = g.hands.map((h, p) => Math.max(0, h.length - (p0.counts[p] ?? 0)));
    let p = r.leader;
    while (need.some(v => v > 0)) { if (need[p] > 0) { order.push(p); need[p]--; } p = (p + 1) % n; }
  }
  if (order.length) dealAnimation(x, order, freshDeal, p0);
  let busyMs = order.length ? order.length * 60 + 280 : 0;

  // The revealed trump card flips over in the middle of the table
  const rv = g.reveal;
  if (rv && (freshDeal || (p0 && p0.revealId !== rv.id))) {
    const revealDelay = order.length * 60 + 150;
    revealAnimation(x, rv, revealDelay);
    const doneAt = revealDelay + 300 + 1150;
    busyMs = doneAt;
    setTimeout(() => { heldTrump = null; if (V) renderGame(); }, doneAt);
  }
  if (busyMs && !reduceMotion) {
    busyUntil = performance.now() + busyMs;
    setTimeout(() => { if (V) renderHandArea(); }, busyMs + 30);
  }
  now.revealId = rv ? rv.id : 0;

  // Your turn: chime + buzz
  if (turnChanged && g.phase === 'play' && r.cur === me) { sfx('turn'); buzz(25); }
}

// ---------- Reactions ----------
const EMOJIS = ['😂', '🤣', '😜', '😏', '🤡', '🐐', '👏', '😡'];
const SIGNS = ['Хаха, қотақбас', 'Сордыңба?', 'Малсыңба?'];
let lastReact = 0;

function sendReaction(r) {
  const now = Date.now();
  if (now - lastReact < 1500 || !code || mySeat < 0) return;    // small cooldown against spam
  lastReact = now;
  closePicker();
  push(roomRef('reactions'), { seat: mySeat, by: myId, r, t: now })
    .then(ref => setTimeout(() => remove(ref), 15000)).catch(() => {});
}

function showReaction(seat, r) {
  if (!V || seat == null) return;
  const x = ctx(), el = x.seatEl(seat);
  if (!el || el.classList.contains('hidden')) return;
  const rect = el.getBoundingClientRect();
  const isSign = SIGNS.includes(r);
  const b = document.createElement('div');
  b.className = isSign ? 'react sign' : 'react';
  b.textContent = isSign ? r : (EMOJIS.includes(r) ? r : '🙂');
  document.body.appendChild(b);
  const w = b.offsetWidth, h = b.offsetHeight;
  const left = Math.min(Math.max(8, rect.left + rect.width / 2 - w / 2), window.innerWidth - w - 8);
  const top = Math.max(8, rect.top + rect.height / 2 - h / 2);
  Object.assign(b.style, { left: left + 'px', top: top + 'px' });
  sfx('pop');
  const dur = isSign ? 3200 : 2200;
  if (reduceMotion) { setTimeout(() => b.remove(), dur); return; }
  const a = b.animate(isSign
    ? [{ transform: 'scale(.3) rotate(-14deg)', opacity: 0 }, { transform: 'scale(1.1) rotate(-4deg)', opacity: 1, offset: .12 },
       { transform: 'scale(1) rotate(-4deg)', opacity: 1, offset: .85 }, { transform: 'scale(.9) rotate(-4deg)', opacity: 0 }]
    : [{ transform: 'scale(.4)', opacity: 0 }, { transform: 'scale(1.3)', opacity: 1, offset: .15 },
       { transform: 'translateY(-50px) scale(1)', opacity: 1, offset: .75 }, { transform: 'translateY(-80px)', opacity: 0 }],
    { duration: dur, easing: 'ease-out' });
  a.onfinish = () => b.remove();
}

// A speech bubble over a player's seat (used for chat messages)
function bubbleAt(seat, text, cls, dur) {
  if (!V || seat == null || seat < 0) return;
  const el = ctx().seatEl(seat);
  if (!el || el.classList.contains('hidden')) return;
  const rect = el.getBoundingClientRect();
  const b = document.createElement('div');
  b.className = 'react ' + cls;
  b.textContent = text;
  document.body.appendChild(b);
  const w = b.offsetWidth, h = b.offsetHeight;
  const left = Math.min(Math.max(8, rect.left + rect.width / 2 - w / 2), window.innerWidth - w - 8);
  const top = Math.max(8, rect.top - h + 10);
  Object.assign(b.style, { left: left + 'px', top: top + 'px' });
  if (reduceMotion) { setTimeout(() => b.remove(), dur); return; }
  b.animate([{ transform: 'translateY(8px) scale(.8)', opacity: 0 }, { transform: 'none', opacity: 1, offset: .08 },
             { transform: 'none', opacity: 1, offset: .9 }, { transform: 'translateY(-6px)', opacity: 0 }],
            { duration: dur, easing: 'ease-out' }).onfinish = () => b.remove();
}

// ---------- Group chat ----------
let chatMsgs = [], chatOpen = false, unread = 0, lastChat = 0;
function renderChat() {
  $('chatTitle').textContent = t('chat');
  $('chatIn').placeholder = t('chatPh');
  $('chatSend').setAttribute('aria-label', t('send'));
  $('chatList').innerHTML = chatMsgs.length
    ? chatMsgs.map(m => `<div class="msg${m.by === myId ? ' mine' : ''}"><b>${esc(m.name)}</b><span>${esc(m.text)}</span></div>`).join('')
    : `<p class="muted">${t('noMsgs')}</p>`;
  $('chatList').scrollTop = $('chatList').scrollHeight;
  const badge = $('chatBadge');
  badge.hidden = !unread;
  badge.textContent = unread > 9 ? '9+' : unread;
  const lc = document.getElementById('lobbyChat');
  if (lc) lc.textContent = `💬 ${t('chat')}${unread ? ` (${unread})` : ''}`;
}
function openChat() { chatOpen = true; unread = 0; $('chat').hidden = false; closePicker(); renderChat(); $('chatIn').focus(); }
function closeChat() { chatOpen = false; $('chat').hidden = true; }
function sendChat() {
  const text = $('chatIn').value.trim().slice(0, 200);
  if (!text || !code || Date.now() - lastChat < 700) return;
  lastChat = Date.now();
  const name = mySeat >= 0 && seats[mySeat] ? seats[mySeat].name : myName;
  push(roomRef('chat'), { seat: mySeat, by: myId, name, text, t: Date.now() }).catch(() => {});
  $('chatIn').value = '';
}
$('btnChat').onclick = ev => { ev.stopPropagation(); chatOpen ? closeChat() : openChat(); };
$('chatClose').onclick = closeChat;
$('chatSend').onclick = sendChat;
$('chatIn').addEventListener('keydown', ev => { if (ev.key === 'Enter') { ev.preventDefault(); sendChat(); } });

function openPicker() {
  const p = $('picker');
  p.innerHTML = EMOJIS.map(e => `<button class="emo" data-r="${e}">${e}</button>`).join('') +
    SIGNS.map(sg => `<button class="signbtn" data-r="${sg}">${sg}</button>`).join('');
  p.hidden = false;
  p.querySelectorAll('[data-r]').forEach(b => b.onclick = ev => { ev.stopPropagation(); sendReaction(b.dataset.r); });
}
function closePicker() { $('picker').hidden = true; }
$('btnReact').onclick = ev => {
  ev.stopPropagation();
  if (!V) return;
  $('picker').hidden ? openPicker() : closePicker();
};
document.addEventListener('click', ev => { if (!$('picker').hidden && !$('picker').contains(ev.target)) closePicker(); });

function rulesHTML(n) {
  const thr = n === 3 ? 31 : 41;
  const items = [n === 4 ? 'r_team4' : n === 3 ? 'r_team3' : 'r_team2', 'r_lead'];
  if (n === 2) items.push('r_flow2'); else items.push('r_flow', 'r_flow3');
  items.push('r_six', 'r_rank');
  const pen = `${t(n === 3 ? 'r_pen3' : 'r_pen')} ${t('r_pen2', { t: thr })}`;
  return `<ul>${items.map(k => `<li>${esc(t(k))}</li>`).join('')}<li>${esc(pen)}</li>
    <li>${esc(t('r_double'))}</li><li>${esc(t('r_equal'))}</li><li>${esc(t('r_end'))}</li></ul>`;
}

$('btnRules').onclick = () => {
  rulesOpen = true;
  showOverlay(`<h2>${t('rules')}</h2>${rulesHTML(meta ? meta.n : 4)}<button id="closeRules">${t('back')}</button>`);
  $('closeRules').onclick = () => { rulesOpen = false; hideOverlay(); renderAll(); };
};
const soundLabel = () => { $('btnSound').textContent = soundOn ? t('soundOn') : t('soundOff'); };
soundLabel();
$('btnSound').onclick = () => {
  soundOn = !soundOn; store.set('kozelSound', soundOn ? 'on' : 'off'); soundLabel();
  if (soundOn) sfx('turn');
};
$('btnLeave').onclick = () => {
  if (!confirm(isHost ? t('confirmHost') : t('confirmLeave'))) return;
  leaveRoom(); showHome();
};

// ---------- Language ----------
let homeArgs = ['', ''];
function applyStaticText() {
  document.documentElement.lang = lang;
  soundLabel();
  $('btnLeave').textContent = t('leave');
  $('btnRules').textContent = t('rules');
  $('btnLang').textContent = LANGS[lang];
  document.title = t('title');
  if (!V) { $('btnPlay').textContent = t('play'); $('btnDown').textContent = t('down'); }
  if (code) $('roomLabel').textContent = t('roomN', { c: code });
  renderChat();
}
function setLang(l) {
  lang = TEXT[l] ? l : 'kk';
  store.set('kozelLang', lang);
  applyStaticText();
  if (code && meta) { rulesOpen = false; renderAll(); }
  else showHome(...homeArgs);
}
$('btnLang').onclick = () => {
  const keys = Object.keys(LANGS);
  setLang(keys[(keys.indexOf(lang) + 1) % keys.length]);
};
lang = TEXT[store.get('kozelLang')] ? store.get('kozelLang') : 'kk';
applyStaticText();

// ---------- Start ----------
const urlRoom = new URLSearchParams(location.search).get('room');
if (urlRoom && myName) joinRoom(urlRoom).catch(e => showHome(urlRoom, 'Could not join: ' + e.message));
else showHome(urlRoom || '');

</script>
